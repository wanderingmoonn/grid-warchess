<!doctype html>
<html lang="zh-CN" data-ui-layout="refined" data-terrain="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>时代与回旋镖 · 棋盘视角对比</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="angle-preview" data-view="compare">
      <header class="angle-header">
        <div>
          <p>时代与回旋镖</p>
          <h1>棋盘视角对比</h1>
        </div>
        <div class="angle-controls" role="group" aria-label="显示视角">
          <button type="button" data-angle="compare" aria-pressed="true">对照</button>
          <button type="button" data-angle="flat" aria-pressed="false">正俯视</button>
          <button type="button" data-angle="tilted" aria-pressed="false">斜俯视</button>
        </div>
      </header>
      <div class="angle-panels">
        <figure id="flat-panel">
          <figcaption>正俯视 <span data-map-size></span></figcaption>
          <div class="angle-scene flat-scene" role="img" aria-label="平原、丘陵、高山、河流和两方城池的正俯视图">
            <div id="flat-board" class="board"></div>
          </div>
        </figure>
        <figure id="tilted-panel">
          <figcaption>斜俯视 <span data-map-size></span></figcaption>
          <div class="angle-scene tilted-scene">
            <canvas id="tilted-board" role="img" aria-label="同一张地图的斜俯视图，丘陵、山体和城墙高度清晰可见"></canvas>
          </div>
        </figure>
      </div>
      <ul class="angle-legend" aria-label="地形图例">
        <li><i style="--swatch:#dce4c7"></i>平原</li>
        <li><i style="--swatch:#86a866"></i>森林</li>
        <li><i style="--swatch:#d6c08f"></i>丘陵</li>
        <li><i style="--swatch:#9aa7b5"></i>高山</li>
        <li><i style="--swatch:#9ebfd2"></i>河流</li>
      </ul>
    </main>
    <script type="module" src="../../src/prototypes/board-angle.ts"></script>
  </body>
</html>
