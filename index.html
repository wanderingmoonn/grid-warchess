<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时代与回旋镖 · 回合制</title>
    <meta name="description" content="从冷兵器打到二战的回合制战棋：五个时代、产兵、经济、方格移动、战争迷雾。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='8' height='8' fill='%232f6ea8'/%3E%3Crect x='8' width='8' height='8' fill='%23e8e2d4'/%3E%3Crect y='8' width='8' height='8' fill='%23e8e2d4'/%3E%3Crect x='8' y='8' width='8' height='8' fill='%232f6ea8'/%3E%3C/svg%3E"
    />
    <style>
      /*
       * 首屏占位。
       *
       * 打包后的 JS 有一百多 KB，从点开链接到第一帧之间总有一段空白。
       * 白屏会让人以为"站点坏了"而去刷新，反而更慢；这里先放一个转圈，
       * 首帧渲染时 main.ts 会用 innerHTML 把 #app 整个换掉，占位自动消失。
       * 所以它必须写在 #app 里面，而且样式不能依赖任何外部资源。
       */
      #app .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #eae6dc;
        color: #57534b;
        font: 14px/1.6 system-ui, 'Microsoft YaHei', sans-serif;
      }
      #app .boot i {
        width: 34px;
        height: 34px;
        border: 3px solid #c9c3b4;
        border-top-color: #2f6ea8;
        border-radius: 8px;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app .boot i {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot"><i></i><p>正在布置战场…</p></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
